name: myworkflow1
on:
  push:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
          whoami
          cd
          ls -al
          pwd
          echo alisha
          docker --version
          docker compose version
      - name: mystep2-clone the repo in current directory
        uses: actions/checkout@v4
      - name: mystep3-check the source code
        run: ls -al
      - name: mystep4-build docker image
        run: docker image build -t alishakhannnnnnnnn03/myimage_oct31:t${{ github.run_number }} -f Dockerfile .
      - name: mystep5-check the docker images
        run: docker images
      - name: mystep5-login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: mystep6-push the docker image
        run: docker image push alishakhannnnnnnnn03/myimage_oct31:t${{ github.run_number }}
